[pytest]
testpaths = testcases
python_files = test_*.py
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: 冒烟用例
    boundary: 边界与异常场景用例

# ---- 日志 ----
# 问题背景：RequestUtil 里用 logging.getLogger() 打了 REQ/RES，但全仓库从未配置过日志，
# root logger 停在 WARNING，info 级别的请求响应日志被完全吞掉（README 承诺的能力实际没生效）。
# 这里用 pytest 原生日志配置统一接管：控制台 + 文件双写。
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs/run.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
