# 环境配置：换环境只改这里，代码里不出现任何 URL
#
# 说明：JSONPlaceholder 只提供一套公开演示接口，所以 dev / test 指向同一地址，
# 目的是演示「环境切换机制」本身；接真实系统时把 base_url / headers 换掉即可，代码零改动。
#
# 优先级：pytest --env <name>  >  环境变量 TEST_ENV  >  本文件的 default

default: test

dev:
  base_url: https://jsonplaceholder.typicode.com
  timeout: 10
  retries: 1
  verify_ssl: true
  headers:
    Accept: application/json
    X-Client-Env: dev

test:
  base_url: https://jsonplaceholder.typicode.com
  timeout: 10
  retries: 2
  verify_ssl: true
  headers:
    Accept: application/json
    X-Client-Env: test

prod:
  base_url: https://jsonplaceholder.typicode.com   # TODO: 换成真实生产地址
  timeout: 20
  retries: 0
  verify_ssl: true
  headers:
    Accept: application/json
    X-Client-Env: prod
